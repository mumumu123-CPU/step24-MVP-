# fly.toml app configuration file generated for psychiatric-review-site on 2025-07-06T00:26:27+09:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'psychiatric-review-site'
primary_region = 'nrt'
console_command = 'php /var/www/html/artisan tinker'

[build]
  [build.args]
    NODE_VERSION = '18'
    PHP_VERSION = '8.2'

[env]
  APP_ENV = 'production'
  APP_NAME = 'psychiatric-review-site'
  APP_DEBUG = 'false'
  APP_URL = 'https://psychiatric-review-site.fly.dev'
  LOG_CHANNEL = 'stderr'
  LOG_LEVEL = 'info'
  LOG_STDERR_FORMATTER = 'Monolog\Formatter\JsonFormatter'
  SESSION_DRIVER = 'cookie'
  SESSION_SECURE_COOKIE = 'true'
  SESSION_LIFETIME = '120'
  SESSION_ENCRYPT = 'false'
  SESSION_PATH = '/'
  SESSION_DOMAIN = 'null'
  DB_CONNECTION = 'pgsql'
  DB_HOST = 'pgsql'
  DB_PORT = '5432'
  DB_DATABASE = 'laravel'
  DB_USERNAME = 'sail'
  
  

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
